# Pipeline deploy PPID Food Station.
#
# Runner: shell executor yang dipasang langsung di server aplikasi
# (192.168.1.21), tag `ppid-prod`. Runner SaaS GitLab.com tidak dipakai karena
# tidak bisa menjangkau IP privat.
#
# CATATAN PENTING:
# - Struktur folder aktual di server: api-ppid, fe-ppid, be-ppid (bukan api/fe/adm)
# - PHP wajib 8.2 (bukan default sistem 8.3) — lcobucci/jwt tidak kompatibel 8.3
# - Queue pakai QUEUE_CONNECTION=sync, jadi TIDAK butuh supervisorctl/queue worker
# - storage/ dan bootstrap/cache/ butuh fix ownership setiap deploy (www-data)
# - rsync pakai --no-g --no-o --no-t --no-p supaya tidak coba ubah metadata file
#   yang bukan miliknya sendiri (gitlab-runner bukan owner file lama) — itu
#   selalu gagal untuk non-root dan bikin exit status 23. File baru otomatis
#   ikut grup folder induk berkat bit setgid yang sudah dipasang di /var/app/ppid/*.
# - HOME=/tmp (atau /var/www) wajib di setiap panggilan composer/artisan sebagai
#   www-data, karena /var/www bukan home directory yang otomatis writable.
#
# Variabel yang harus diisi di Settings -> CI/CD -> Variables:
#   VITE_MAP_KEY (Google Maps — kuotanya bisa dihabiskan orang lain, jadi
#   tidak ditaruh di repo)
#
# JANGAN centang Protected kecuali branch main memang terdaftar sebagai
# protected branch. Variabel Protected tidak diekspos ke job pada branch yang
# tidak protected, tanpa jejak apa pun di log — itu sudah pernah membuat
# build:adm menghasilkan artefak rusak dua kali berturut-turut.
#
# VITE_API_BASE_URL, VITE_MEDIA_BASE_URL, dan VITE_RECAPTCHA_SITE_KEY TIDAK
# lagi datang dari sini. Ketiganya publik — Vite menanamnya ke berkas build
# yang dilayani ke setiap pengunjung — jadi nilainya hidup di
# be-ppid/.env.production di dalam repo. Sebelumnya ketiganya variabel CI,
# dan build:adm dua kali menghasilkan artefak rusak karena variabelnya tidak
# terekspos ke job tanpa satu pun peringatan.


stages:
  - build
  - deploy

variables:
  DEPLOY_ROOT: /var/app/ppid
  PHP_BIN: php8.2
  COMPOSER_BIN: /usr/local/bin/composer
  GIT_DEPTH: "20"

# ---------------------------------------------------------------- BUILD ----

build:adm:
  stage: build
  tags: [ppid-prod]
  script:
    - cd be-ppid
    - npm ci
    - npm run build
  artifacts:
    paths:
      - be-ppid/build/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build:fe-assets:
  stage: build
  tags: [ppid-prod]
  script:
    - cd fe-ppid
    - npm ci
    - npm run build
  artifacts:
    paths:
      - fe-ppid/public/build/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# --------------------------------------------------------------- DEPLOY ----
#
# PERINGATAN soal `rsync --delete`:
# `--exclude='.env'` dan `--exclude='storage/'` bersifat kritis. Tanpa keduanya,
# --delete akan menghapus .env produksi dan SELURUH berkas unggahan pemohon.
# Periksa dua opsi itu setiap kali menyunting berkas ini.

deploy:api:
  stage: deploy
  tags: [ppid-prod]
  needs: []
  script:
    - rsync -a --no-g --no-o --no-t --no-p --delete --exclude='.env' --exclude='storage/' --exclude='vendor/' api-ppid/ "$DEPLOY_ROOT/api-ppid/"
    - cd "$DEPLOY_ROOT/api-ppid"
    - sudo -u www-data HOME=/tmp $PHP_BIN $COMPOSER_BIN install --no-dev --optimize-autoloader --no-interaction
    - sudo chown -R fsit:www-data storage bootstrap/cache
    - sudo chmod -R 2775 storage bootstrap/cache
    - sudo -u www-data HOME=/tmp $PHP_BIN artisan migrate --force
    - sudo -u www-data HOME=/tmp $PHP_BIN artisan config:cache
    - sudo -u www-data HOME=/tmp $PHP_BIN artisan route:cache
    - sudo -u www-data HOME=/tmp $PHP_BIN artisan view:cache
    # Menggagalkan deploy bila ada konfigurasi wajib yang belum dipasang di
    # server. `.env` sepenuhnya milik server (diisi manual), pipeline tidak
    # pernah menyentuhnya — command ini hanya memvalidasi, bukan mengisi.
    - sudo -u www-data HOME=/tmp $PHP_BIN artisan ppid:periksa-konfigurasi
  environment:
    name: production/api
    url: https://api-ppid.foodstation.co.id
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

deploy:fe:
  stage: deploy
  tags: [ppid-prod]
  needs: ["build:fe-assets"]
  script:
    - rsync -a --no-g --no-o --no-t --no-p --delete --exclude='.env' --exclude='storage/' --exclude='vendor/' --exclude='public/storage' fe-ppid/ "$DEPLOY_ROOT/fe-ppid/"
    - cd "$DEPLOY_ROOT/fe-ppid"
    - sudo -u www-data HOME=/tmp $PHP_BIN $COMPOSER_BIN install --no-dev --optimize-autoloader --no-interaction
    - sudo chown -R fsit:www-data storage bootstrap/cache
    - sudo chmod -R 2775 storage bootstrap/cache
    - sudo -u www-data HOME=/tmp $PHP_BIN artisan config:cache
    - sudo -u www-data HOME=/tmp $PHP_BIN artisan route:cache
    - sudo -u www-data HOME=/tmp $PHP_BIN artisan view:cache
    - test -L public/storage || sudo -u www-data HOME=/tmp $PHP_BIN artisan storage:link
  environment:
    name: production/fe
    url: https://ppid.foodstation.co.id
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

# Yang dikirim ke server hanyalah `build/` — hasil kompilasi Vite. Source
# TypeScript-nya tidak pernah ikut, jadi `$DEPLOY_ROOT/be-ppid/src/` berisi
# salinan lama yang tertinggal dari entah kapan dan tidak dipakai untuk apa
# pun. Membacanya untuk mendiagnosis panel akan menyesatkan: pernah terjadi,
# dan menghasilkan kesimpulan bahwa panel masih memakai captcha gambar padahal
# berkas yang benar-benar dilayani sudah reCAPTCHA v2. Yang sahih dibaca adalah
# isi build/, atau bundle yang diunduh langsung dari adm-ppid.foodstation.co.id.
deploy:adm:
  stage: deploy
  tags: [ppid-prod]
  needs: ["build:adm"]
  script:
    - rsync -a --no-g --no-o --no-t --no-p --delete be-ppid/build/ "$DEPLOY_ROOT/be-ppid/build/"
    - sudo chown -R www-data:www-data "$DEPLOY_ROOT/be-ppid/build"
  environment:
    name: production/adm
    url: https://adm-ppid.foodstation.co.id
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual