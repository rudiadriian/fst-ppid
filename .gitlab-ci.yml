# Pipeline deploy PPID Food Station.
#
# Runner: shell executor yang dipasang langsung di server aplikasi
# (192.168.1.21), tag `ppid-prod`. Runner SaaS GitLab.com tidak dipakai karena
# tidak bisa menjangkau IP privat.
#
# CATATAN PENTING:
# - Struktur folder aktual di server: api-ppid, fe-ppid, be-ppid (bukan api/fe/adm)
# - PHP wajib 8.2 (bukan default sistem 8.3) — lcobucci/jwt tidak kompatibel 8.3
# - Queue pakai QUEUE_CONNECTION=sync, jadi TIDAK butuh supervisorctl/queue worker
# - storage/ dan bootstrap/cache/ butuh fix ownership setiap deploy (www-data)
# - rsync pakai --no-g --no-o supaya tidak coba chgrp/chown file yang bukan
#   miliknya sendiri (gitlab-runner bukan owner file lama) — itu selalu gagal
#   untuk non-root dan bikin exit status 23. File baru otomatis ikut grup folder
#   induk berkat bit setgid yang sudah dipasang di /var/app/ppid/*.
#
# Variabel yang harus diisi di Settings -> CI/CD -> Variables (Protected+Masked):
#   VITE_API_BASE_URL, VITE_MEDIA_BASE_URL, VITE_MAP_KEY
#
# `.env` Laravel TIDAK disimpan di CI. Berkas itu hidup di server dan tidak
# pernah disentuh pipeline — itulah sebabnya setiap rsync meng-exclude-nya.

stages:
  - build
  - deploy

variables:
  DEPLOY_ROOT: /var/app/ppid
  PHP_BIN: php8.2
  COMPOSER_BIN: /usr/local/bin/composer
  GIT_DEPTH: "20"

# ---------------------------------------------------------------- BUILD ----

build:adm:
  stage: build
  tags: [ppid-prod]
  script:
    - cd be-ppid
    - npm ci
    - npm run build
  artifacts:
    paths:
      - be-ppid/build/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build:fe-assets:
  stage: build
  tags: [ppid-prod]
  script:
    - cd fe-ppid
    - npm ci
    - npm run build
  artifacts:
    paths:
      - fe-ppid/public/build/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# --------------------------------------------------------------- DEPLOY ----
#
# PERINGATAN soal `rsync --delete`:
# `--exclude='.env'` dan `--exclude='storage/'` bersifat kritis. Tanpa keduanya,
# --delete akan menghapus .env produksi dan SELURUH berkas unggahan pemohon.
# Periksa dua opsi itu setiap kali menyunting berkas ini.

deploy:api:
  stage: deploy
  tags: [ppid-prod]
  needs: []
  script:
    - rsync -a --no-g --no-o --no-t --delete --exclude='.env' --exclude='storage/' --exclude='vendor/' api-ppid/ "$DEPLOY_ROOT/api-ppid/"
    - cd "$DEPLOY_ROOT/api-ppid"
    - sudo -u www-data $PHP_BIN $COMPOSER_BIN install --no-dev --optimize-autoloader --no-interaction
    - sudo chown -R fsit:www-data storage bootstrap/cache
    - sudo chmod -R 2775 storage bootstrap/cache
    - sudo -u www-data HOME=/tmp $PHP_BIN artisan migrate --force
    - sudo -u www-data HOME=/tmp $PHP_BIN artisan config:cache
    - sudo -u www-data HOME=/tmp $PHP_BIN artisan route:cache
    - sudo -u www-data HOME=/tmp $PHP_BIN artisan view:cache
  environment:
    name: production/api
    url: https://api-ppid.foodstation.co.id
  rules:
    # Rilis produksi selalu dipicu manusia, tidak otomatis saat push.
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

deploy:fe:
  stage: deploy
  tags: [ppid-prod]
  needs: ["build:fe-assets"]
  script:
    - rsync -a --no-g --no-o --no-t --delete --exclude='.env' --exclude='storage/' --exclude='vendor/' --exclude='public/storage' fe-ppid/ "$DEPLOY_ROOT/fe-ppid/"
    - cd "$DEPLOY_ROOT/fe-ppid"
    - sudo -u www-data $PHP_BIN $COMPOSER_BIN install --no-dev --optimize-autoloader --no-interaction
    - sudo chown -R fsit:www-data storage bootstrap/cache
    - sudo chmod -R 2775 storage bootstrap/cache
    # TIDAK ADA `artisan migrate` di sini. Skema database dimiliki api-ppid saja
    # — folder migrations fe-ppid sengaja kosong.
    - sudo -u www-data HOME=/tmp $PHP_BIN artisan config:cache
    - sudo -u www-data HOME=/tmp $PHP_BIN artisan route:cache
    - sudo -u www-data HOME=/tmp $PHP_BIN artisan view:cache
    - test -L public/storage || sudo -u www-data HOME=/tmp $PHP_BIN artisan storage:link
  environment:
    name: production/fe
    url: https://ppid.foodstation.co.id
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

deploy:adm:
  stage: deploy
  tags: [ppid-prod]
  needs: ["build:adm"]
  script:
    - rsync -a --no-g --no-o --no-t --delete be-ppid/build/ "$DEPLOY_ROOT/be-ppid/build/"
    - sudo chown -R www-data:www-data "$DEPLOY_ROOT/be-ppid/build"
  environment:
    name: production/adm
    url: https://adm-ppid.foodstation.co.id
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual