        <meta name='keywords' content='PPID,Admin,Panel,Informasi Publik,Dashboard'>

          manifest.json provides metadata used when your web app is added to the

        <link rel='manifest' href='/manifest.json'>
        <!--
          Ikon tab, taskbar, dan layar utama disamakan dengan portal pemohon
          (langkah 99). Ketiganya menunjuk berkas yang sama persis dengan
          fe-ppid; panel dan portal adalah satu layanan, dan ikon yang berbeda
          membuat keduanya tampak sebagai dua situs yang tidak berhubungan di
          bilah tab maupun taskbar.
        -->
        <link rel='icon' href='/assets/images/logo/favicon.ico' sizes='any'>
        <link rel='shortcut icon' type='image/x-icon' href='/assets/images/logo/favicon.ico'>
        <link rel='apple-touch-icon' href='/assets/images/logo/logo_fs.png'>

        <!--<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">-->

        <!--        You can choose main icon from variety of the material ui icon fonts-->
        <link href='/assets/fonts/material-design-icons/MaterialIconsOutlined.css' rel='stylesheet'>
        <!--        <link href="/assets/fonts/material-design-icons/MaterialIcons.css" rel="stylesheet">-->
        <!--        <link href="/assets/fonts/material-design-icons/MaterialIconsRound.css" rel="stylesheet">-->
        <!--        <link href="/assets/fonts/material-design-icons/MaterialIconsSharp.css" rel="stylesheet">-->
        <!--        <link href="/assets/fonts/material-design-icons/MaterialIconsTwoTone.css" rel="stylesheet">-->

        <link href='/assets/fonts/Geist/geist.css' rel='stylesheet'>
        <link href='/assets/fonts/meteocons/style.css' rel='stylesheet'>

        <link href='/assets/styles/prism.css' rel='stylesheet'>

        <noscript id='emotion-insertion-point'></noscript>
        <!--
          Notice the use of  in the tags above.
          It will be replaced with the URL of the `public` folder during the build.
          Only files inside the `public` folder can be referenced from the HTML.

          Unlike "/favicon.ico" or "favicon.ico", "/favicon.ico" will
          work correctly both with client-side routing and a non-root public URL.
          Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>PPID Food Station</title>

        <!-- Splash Screen CSS -->
        <style>
            body #fuse-splash-screen {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                /*
                  Latar terang, bukan #121212 seperti bawaan template: maskotnya
                  bergaris putih dan tenggelam di atas latar gelap. Ragam
                  gelapnya memakai hijau tua yang sama dengan panel.
                */
                background-color: #FFFFFF;
                color: #10462F;
                z-index: 999999;
                pointer-events: none;
                opacity: 1;
                visibility: visible;
                transition: opacity 400ms cubic-bezier(0.4, 0, 0.2, 1);
            }

            @media (prefers-color-scheme: dark) {
                body #fuse-splash-screen {
                    background-color: #082217;
                    color: #E0E0E0;
                }
            }

            /*
              Pemuat: satu berkas GIF yang sudah beranimasi sendiri, jadi tidak
              ada keyframes yang perlu ditulis di sini. Lebarnya dikunci supaya
              maskotnya tidak melar di layar lebar.
            */
            body #fuse-splash-screen .loader {
                width: 180px;
                max-width: 60vw;
                height: auto;
            }

            body #fuse-splash-screen .keterangan {
                margin-top: 20px;
                font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
                font-size: 13px;
                letter-spacing: 0.02em;
                opacity: 0.7;
            }
        </style>
        <!-- / Splash Screen CSS -->
    </head>
    <body id="root">

    <noscript>
        You need to enable JavaScript to run this app.
    </noscript>

    <div id='app' class='flex'>
        <!-- Splash Screen -->
        <div id='fuse-splash-screen'>
            <img class='loader' src='/assets/images/logo/loader-fs.gif' alt='Memuat…'>
            <div class='keterangan'>Memuat…</div>
        </div>
        <!-- / Splash Screen -->
    </div>
    <script type="module" src="/src/index.tsx"></script>

</html>
